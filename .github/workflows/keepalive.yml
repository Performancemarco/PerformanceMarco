name: Mantener Supabase activo

# Una consulta ligera dos veces por semana evita que el plan gratis de Supabase
# pause el proyecto por inactividad. Solo usa la clave pública (anon).
on:
  schedule:
    - cron: "17 7 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de datos
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://klqhsemcollylephbpqk.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_GtCxWgCfWy8pAJIb12_dYA_jfWWGJHK")
          echo "Respuesta de Supabase: $code"
          # 200/401/403 significan que la base de datos está despierta y respondiendo
          case "$code" in 200|401|403) exit 0;; *) echo "Supabase no responde como se esperaba"; exit 1;; esac
