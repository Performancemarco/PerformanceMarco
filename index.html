<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--r:#e63946;--o:#f97316;--y:#fbbf24;--g:#22c55e;--b:#38bdf8;--p:#a78bfa}
body{background:#0a0a0c;background-image:radial-gradient(900px 500px at 85% -10%,#e6394633,transparent 60%),radial-gradient(700px 500px at -10% 30%,#f9731618,transparent 60%),radial-gradient(600px 400px at 60% 110%,#a78bfa14,transparent 60%);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
.inp{width:100%;background:#0c0c0f;border:1px solid #3a3a44;color:#fff;border-radius:12px;padding:.65rem .75rem;font-size:16px}.inp:focus{outline:0;border-color:#e63946;box-shadow:0 0 0 3px #e6394640}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a1a1aa 50%),linear-gradient(135deg,#a1a1aa 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:2rem}
.num{text-align:center;font-weight:800;font-size:18px;padding:.7rem .2rem}.num::placeholder{color:#52525b;font-weight:500}
.btn{border-radius:12px;font-weight:800;padding:.7rem 1rem;background:linear-gradient(135deg,#e63946,#f97316);color:#fff;box-shadow:0 6px 18px #e6394645;transition:.15s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn2{border-radius:12px;font-weight:700;padding:.55rem .85rem;border:1px solid #4b4b55;color:#e4e4e7;background:#ffffff08;transition:.15s}.btn2:active{transform:scale(.97)}
.btn3{border-radius:12px;font-weight:800;padding:.65rem 1rem;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.card{background:linear-gradient(180deg,#1d1d23cc,#141418cc);border:1px solid #2f2f38;border-radius:20px;padding:1rem;backdrop-filter:blur(6px);box-shadow:0 10px 30px #0006}
.kpi{border-radius:18px;padding:.85rem 1rem;border:1px solid #2f2f38;position:relative;overflow:hidden;background:linear-gradient(160deg,#202027,#141418)}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,#e63946)}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.12em;color:#a1a1aa;text-transform:uppercase}.kpi .v{font-size:28px;font-weight:900;line-height:1.1;color:var(--c,#fff)}.kpi .s{font-size:11px;color:#8b8b95}
.chk{-webkit-appearance:none;appearance:none;width:36px;height:36px;border-radius:11px;border:2px solid #52525b;background:#0c0c0e;display:grid;place-content:center;flex:none}
.chk:checked{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#22c55e}.chk:checked::after{content:"✓";color:#fff;font-weight:900;font-size:20px}
.sg{display:grid;grid-template-columns:2rem 1fr 1fr 2.4rem;gap:.5rem;align-items:center}.sg3{grid-template-columns:2rem 1fr 2.4rem}
.mc{display:flex;gap:.7rem;align-items:flex-start;border:1px solid #3a3a44;border-radius:14px;padding:.7rem .8rem;background:#ffffff06;cursor:pointer}.mc input{margin-top:.2rem;width:18px;height:18px;accent-color:#e63946;flex:none}.mc small{display:block;color:#a1a1aa;font-size:12px;font-weight:500;line-height:1.3}.mc:has(input:checked){border-color:#e63946;background:#e6394618}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .55rem;border-radius:99px;font-size:11px;font-weight:800;border:1px solid}
.sub{padding:.45rem .8rem;border-radius:99px;font-weight:800;font-size:13px;color:#a1a1aa;background:#ffffff08;border:1px solid #2f2f38;white-space:nowrap}.sub.on{background:linear-gradient(135deg,#e63946,#f97316);color:#fff;border-color:transparent}
.rt{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}.rt button{padding:.65rem 0;border-radius:12px;border:1px solid #3a3a44;font-weight:900;color:#a1a1aa;background:#0c0c0f}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .4rem;font-size:10px;font-weight:800;color:#71717a;letter-spacing:.03em}.nv svg{width:22px;height:22px}.nv.on{color:#fff}.nv.on svg{color:#e63946;filter:drop-shadow(0 0 6px #e6394699)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cd{aspect-ratio:1/1.3;border-radius:12px;border:1px solid #2f2f38;background:#16161a;padding:3px;text-align:center;font-weight:800;font-size:13px;position:relative}
.cd small{display:block;font-size:8px;font-weight:800;line-height:1.1;margin-top:1px;overflow:hidden}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;padding:.7rem 1.2rem;border-radius:99px;font-weight:700;display:none;z-index:99;max-width:92vw;text-align:center;box-shadow:0 8px 24px #0008}
#sheet{position:fixed;inset:0;background:#000a;z-index:60;display:none;align-items:flex-end;justify-content:center}#sheet>div{width:100%;max-width:520px;background:#16161a;border:1px solid #3a3a44;border-radius:24px 24px 0 0;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom))}
.scr{overflow-x:auto;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
@media(min-width:900px){#nav{max-width:520px;left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}}
</style></head>

   lenta: {n: 'Respiración lenta', dur: '5 min', tip: 'Unas 6 respiraciones por minuto, con la exhalación más larga que la inhalación.', steps: [P('Colócate', 'Siéntate o túmbate con los hombros sueltos y la mandíbula relajada.', 15), P('Respira lento', 'Inhala por la nariz y exhala más largo de lo que inhalas.', 285, [4, 6, 'Inhala', 'Exhala'])]},
   r9090: {n: '90/90 en pared', dur: '5 min', tip: 'Muy útil para volver a la calma tras entrenar: además recoloca pelvis y costillas.', steps: [P('Posición 90/90', 'Tumbado, pies apoyados en la pared con caderas y rodillas a 90°.', 30), P('Inhala 4 s, exhala largo', 'Inhala por la nariz como si inflaras un globo en las costillas; exhala por la boca.', 270, [4, 7, 'Inhala · nariz', 'Exhala · boca'])]},

  body: () => `<p class="text-sm text-zinc-300">Respirar despacio, con la exhalación más larga que la inhalación, es la herramienta más barata y segura. La respiración lenta voluntaria aumenta la variabilidad de la frecuencia cardiaca, un marcador de activación parasimpática.</p>${rtable(['Técnica', 'Para qué'], [['Diafragmática («el globo»)', 'Base de las demás: aprender a respirar con el diafragma.'], ['90/90 en pared', 'Vuelta a la calma tras el entrenamiento.'], ['Respiración lenta', 'Relajación general y antes de dormir.'], ['Suspiro cíclico', 'Bajar rápido la activación: tras el partido o con nervios.']])}${rbox('SI TE MAREAS', 'Si te mareas o te hormiguean las manos, estás respirando demasiado fuerte. Hazlo más suave y más lento, no más profundo.')}`},
 foam: {n: 'Foam roller', lvl: 'rec', short: 'Antes: movilidad y activación. Después: menos dolor muscular.', when: 'Antes del calentamiento (y en la activación pre-partido) y el día siguiente al partido o tras sesiones de mucha carga.', dose: 'Antes ≈ 6 min (30–60 s por zona). Después ≈ 12 min (60–90 s por zona).',
  variants: {pre: {n: 'Antes (activación)', dur: '≈6 min', tip: 'Ritmo vivo, pasadas continuas y sin pausas largas. Va ANTES del calentamiento dinámico, no lo sustituye.', steps: foamSteps(true)}, post: {n: 'Después (recuperación)', dur: '≈12 min', tip: 'Ritmo lento, pausas de 10–20 s en los puntos tensos y respiración tranquila.', steps: foamSteps(false)}},
  body: () => `<p class="text-sm text-zinc-300">Funciona mejor <b>antes</b> de entrenar: mejora algo la flexibilidad (≈ +4 %) y el sprint (≈ +0,7 %) sin perjudicar la fuerza ni el salto. Después, su efecto más claro es reducir el dolor muscular percibido (≈ −6 %). Más de 30–120 s por grupo muscular no da más efecto.</p>${rtable(['Zona', 'Técnica'], FZ.map(z => [z[0], z[1]]).concat([['Columna dorsal', 'Boca arriba, rodillo bajo las escápulas, manos en la nuca; extiéndete sobre el rodillo.']]))}${rbox('NORMAS DE SEGURIDAD', ul(['Presión molesta pero tolerable: máximo 5–6 sobre 10. Si aprietas los dientes o contienes la respiración, baja la carga.', 'Nunca sobre huesos, articulaciones, zona lumbar o cuello.', 'No lo uses sobre una lesión aguda, un golpe reciente o un hematoma.']))}`},
 auto: {n: 'Automasaje con dedos', lvl: 'rec', short: 'Reduce agujetas y fatiga percibida y te enseña a reconocer tus zonas de carga.', when: 'La noche del partido y el día siguiente, o tras sesiones de mucha carga (mejor antes de dormir).', dose: '8–10 min usando las tres técnicas en 3–4 zonas.',
  variants: {completo: {n: 'Completo', dur: '10 min', tip: 'Sin dolor punzante: la presión baja de 5 sobre 10 enseguida.', steps: masSteps([['Gemelo y sóleo', 'Sentado, pierna flexionada. Trabaja ambas piernas alternando.'], ['Cuádriceps', 'Especialmente la parte baja, cerca de la rótula.'], ['Isquiotibiales', 'En sedestación, con el muslo relajado.'], ['Planta del pie y Aquiles', 'Pie sobre la rodilla contraria.']])}, rapido: {n: 'Rápido', dur: '5 min', tip: 'Para cuando vas justo de tiempo.', steps: masSteps([['Gemelo y sóleo', 'Sentado, pierna flexionada.'], ['Cuádriceps', 'Especialmente la parte baja.']])}},
  body: () => `<p class="text-sm text-zinc-300">El masaje es la técnica con más efecto sobre las agujetas y la fatiga percibida (el efecto se nota hasta 96 h y es mayor a las 48 h). El automasaje es su versión de bajo coste: el efecto esperado es menor, pero llega a zonas donde el rodillo no entra.</p>${rtable(['Técnica', 'Cómo', 'Tiempo'], [['Deslizamiento', 'Palma o dedos con algo de crema, pasadas suaves de abajo arriba (hacia el corazón).', '1 min por zona'], ['Amasado', 'Coge el músculo entre los dedos y el pulgar y «amásalo» despacio.', '1 min por zona'], ['Presión sostenida', 'Pulgar sobre un punto tenso hasta que la molestia baje, sin pasar de 5 sobre 10.', '20–30 s por punto']])}<p class="text-sm mt-2"><b>Zonas prioritarias:</b> planta del pie, gemelo y sóleo, tibial anterior, tendón de Aquiles, cuádriceps (sobre todo la parte baja) e isquiotibiales.</p>${rbox('CUÁNDO NO', 'No masajees una zona con golpe reciente, hinchazón, calor o dolor punzante: se lo comunicas a tu entrenador o al fisioterapeuta.', '#ef4444')}`},
 sueno: {n: 'Descanso y sueño', lvl: 'rec', short: 'La herramienta de recuperación más importante y la única imprescindible.', when: 'Todos los días.', dose: '7–9 h por noche (rango habitual en adultos) y horario regular.',
  body: () => `<p class="text-sm text-zinc-300">Dormir lo suficiente es lo que más pesa en la recuperación. Las rutinas de este apartado son complementos: ninguna compensa una mala noche.</p>${rtable(['Estrategia', 'Cómo'], [['Horario regular', 'Acuéstate y levántate a la misma hora, también el fin de semana (como mucho 1 h de diferencia).'], ['Pantallas fuera', 'Apaga móvil, consola y tablet 60 min antes de dormir y deja el móvil cargando fuera del dormitorio.'], ['Habitación', 'Oscura, fresca y silenciosa.'], ['Rutina de bajada', '15–20 min: ducha templada, automasaje, respiración lenta y lectura.'], ['Cena', '1,5–2 h antes de acostarte, con hidratos y proteína tras el partido o el entrenamiento. Bebe agua a lo largo del día, no mucho de golpe por la noche.'], ['Cafeína', 'Evita café y bebidas energéticas por la tarde-noche.']])}${rbox('PARTIDOS DE TARDE O NOCHE', 'Es normal dormir peor esa noche por la activación. Evita pantallas al llegar a casa, haz la rutina de bajada con suspiro cíclico y, si hace falta, compensa con una siesta de 20–30 min antes de las 16:00 al día siguiente.', '#22c55e')}${rbox('SEÑALES DE ALARMA', 'Somnolencia durante el día o en el entrenamiento, dormir de forma habitual por debajo de 7 h, o grandes diferencias entre entre semana y fin de semana. Cuéntaselo a tu entrenador.', '#ef4444')}<p class="text-[11px] text-zinc-500 mt-3">La guía de la que parte esta sección recomienda 8–10 h hasta los 18 años; para adultos se usa el rango habitual de 7–9 h.</p>`},
 nutri: {n: 'Alimentos e hidratación', lvl: 'rec', short: 'Reponer líquidos, hidratos y proteína en el momento adecuado.', when: 'Antes, durante y después de cada sesión y partido.', dose: '300–500 ml de leche con cacao en los 30–60 min tras el partido; ≈20 g de proteína de calidad tras la fuerza.',
  body: () => `<p class="text-sm text-zinc-300">Ningún alimento sustituye a las comidas del día. Los que más respaldo tienen son la <b>leche y los lácteos</b> (proteína, hidratos, agua y electrolitos a la vez) y las <b>cerezas y frutos rojos</b>.</p>${rtable(['Alimento', 'Cuándo y cuánto'], [['Leche o batido de leche con cacao', '30–60 min tras el partido o la sesión: 1 vaso grande (300–500 ml).'], ['Yogur griego, kéfir, queso fresco batido', 'Merienda tras la sesión, con fruta: 1 yogur griego o 200 g de queso batido.'], ['Huevos, carne magra, pescado', 'Comida o cena posterior; ≈20 g de proteína tras la fuerza.'], ['Arroz, pasta, patata, pan, fruta', '1–1,2 g de hidratos por kg y hora en las primeras 4 h si la siguiente sesión está cerca (clave si hay otro partido en menos de 48 h).'], ['Pescado azul (salmón, sardina, caballa)', '2–3 raciones a la semana, como parte de la dieta. Efecto pequeño: no hace falta suplementar.'], ['Cerezas, zumo de cereza ácida, frutos rojos', 'Opcional, sobre todo en semanas congestionadas. Efecto moderado en la fuerza.']])}<p class="font-black mt-4">Hidratación</p>${rtable(['Momento', 'Qué hacer'], [['Antes', 'Llega bien hidratado, con la orina de color claro. Bebe agua con la comida previa y 1 vaso en la hora antes de entrenar.'], ['Durante', 'Agua fresca en cada pausa para no perder más del 2 % de tu peso. La bebida isotónica solo sirve en esfuerzos largos e intensos o con mucho calor.'], ['Después', 'Pésate antes y después y repón 900–1.350 ml por cada kg perdido, repartidos en las horas siguientes y con comida. La leche es una buena opción.'], ['Control diario', 'Orina clara o amarillo pálido es correcto; oscura significa que debes beber más.']])}${rbox('NO COMO BEBIDA DE RECUPERACIÓN', 'Bebidas energéticas ni refrescos. Y ningún suplemento sin control médico, por el riesgo de contaminación y dopaje.', '#ef4444')}`},
 crio: {n: 'Inmersión en agua fría', lvl: 'opt', short: 'Solo en semanas congestionadas, para reducir algo las agujetas.', when: 'Tras el partido (en la primera hora) y solo si el siguiente llega en menos de 72 h, en torneos de varios días o con calor extremo.', dose: '11–15 °C hasta la cintura, 10–15 min.',
  variants: {inmersion: {n: 'Inmersión', dur: '11 min', tip: 'Siempre con otra persona presente. Sal si hay temblores intensos, dolor o la piel se pone blanca.', steps: [P('Prepárate', 'Comprueba con un termómetro que el agua está entre 11 y 15 °C (nunca por debajo de 10 °C) y que alguien está contigo.', 30), P('Sumérgete hasta la cintura', 'Respira lento y tranquilo. Sal antes si notas temblores intensos, dolor o la piel blanca.', 660)]}},
  body: () => `<p class="text-sm text-zinc-300">Reduce algo el dolor muscular, sobre todo en las primeras 6 h, pero usada de forma rutinaria puede <b>frenar las adaptaciones al entrenamiento de fuerza</b> (en un estudio de 12 semanas, quienes se metían en agua fría tras cada sesión ganaron menos fuerza y masa muscular). Por eso se reserva para semanas congestionadas.</p>${rbox('SÍ', ul(['Tras un partido cuando el siguiente llega en menos de 72 h.', 'En torneos de varios días.', 'Con calor extremo.']), '#22c55e')}${rbox('NO', ul(['De forma rutinaria tras todos los partidos.', 'Después de sesiones de fuerza cuyo objetivo es la adaptación.']), '#ef4444')}${rbox('SEGURIDAD', ul(['Con otra persona presente, nunca solo.', 'Temperatura con termómetro, sin bajar de 10 °C.', 'Sal antes si hay temblores intensos, dolor o la piel se pone blanca.', 'No lo hagas con antecedentes de urticaria por frío, Raynaud o problemas cardiacos sin consultarlo con el médico.', 'El hielo local sobre un golpe es manejo de lesión, no recuperación: lo decide el fisioterapeuta.']))}`}};
const recGet = rid => { const [i, v] = String(rid || '').split(':'), T = REC[i]; return T && T.variants && T.variants[v] ? {id: i, v, T, V: T.variants[v]} : null; };
const REC_OPTS = Object.keys(REC).flatMap(i => Object.keys(REC[i].variants || {}).map(v => [i + ':' + v, REC[i].n + ' · ' + REC[i].variants[v].n + ' (' + REC[i].variants[v].dur + ')']));
/* ----- temporizador guiado ----- */
let RT = null;
const mmss = s => Math.floor(s / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
function recBeep() { try { navigator.vibrate && navigator.vibrate(180); const A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(), g = A.createGain(); o.connect(g); g.connect(A.destination); o.frequency.value = 880; g.gain.value = .07; o.start(); setTimeout(() => { o.stop(); A.close(); }, 160); } catch (e) {} }
function recPlay(id, v) {
 const T = REC[id], V = T && T.variants && T.variants[v || Object.keys(T.variants || {})[0]]; if (!V) return recDetail(id); recStop();
 RT = {steps: V.steps, i: 0, left: V.steps[0].s, run: false, iv: null, end: 0, wl: null, n: T.n + ' · ' + V.n};
 openSheet(`<div id="rtbox"><p class="text-[11px] font-black tracking-widest text-teal-300">${esc(RT.n.toUpperCase())}</p><h3 class="text-xl font-black mt-1" id="rtt"></h3><p class="text-sm text-zinc-300 mt-1 min-h-[3.2rem]" id="rtd"></p><div class="text-center my-3"><p id="rtph" class="text-lg font-black text-teal-300 h-7"></p><p id="rttime" class="text-6xl font-black tabular-nums"></p></div><div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div id="rtbar" class="h-full" style="width:0;background:linear-gradient(90deg,#14b8a6,#fbbf24)"></div></div><p id="rtst" class="text-xs text-zinc-400 mt-2 text-center"></p><div class="flex gap-2 mt-4"><button class="btn2" onclick="recPrev()" aria-label="Paso anterior">‹</button><button id="rtgo" class="btn flex-1" onclick="recToggle()">Empezar</button><button class="btn2" onclick="recNext()" aria-label="Paso siguiente">›</button></div><p class="text-[11px] text-zinc-500 mt-3">${esc(V.tip || '')}</p><button class="btn2 w-full mt-2" onclick="closeSheet()">Cerrar</button></div>`); recShow(); }
function recShow() {
 if (!RT || !$('#rtt')) return; const s = RT.steps[RT.i]; $('#rtt').textContent = s.t; $('#rtd').textContent = s.d || ''; $('#rttime').textContent = mmss(RT.left); $('#rtbar').style.width = Math.round((1 - RT.left / s.s) * 100) + '%'; $('#rtst').textContent = `Paso ${RT.i + 1} de ${RT.steps.length}`;
 if (s.pace) { const el = s.s - RT.left, c = s.pace[0] + s.pace[1], pos = el % c; $('#rtph').textContent = pos < s.pace[0] ? s.pace[2] : s.pace[3]; } else $('#rtph').textContent = ''; }
function recToggle() { if (!RT) return; if (RT.run) return recPause(); RT.run = true; RT.end = Date.now() + RT.left * 1000; $('#rtgo').textContent = 'Pausa'; RT.iv = setInterval(recTick, 250); try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { if (RT) RT.wl = w; else w.release(); }).catch(() => {}); } catch (e) {} }
function recPause() { if (!RT) return; RT.run = false; clearInterval(RT.iv); if ($('#rtgo')) $('#rtgo').textContent = 'Seguir'; }
function recTick() { if (!RT) return; const l = Math.ceil((RT.end - Date.now()) / 1000); if (l == RT.left) return; RT.left = l; if (l <= 0) { recBeep(); if (RT.i < RT.steps.length - 1) { RT.i++; RT.left = RT.steps[RT.i].s; RT.end = Date.now() + RT.left * 1000; } else return recDone(); } recShow(); }
function recNext() { if (!RT || RT.i >= RT.steps.length - 1) return; RT.i++; RT.left = RT.steps[RT.i].s; RT.end = Date.now() + RT.left * 1000; recShow(); }
function recPrev() { if (!RT) return; if (RT.i > 0 && RT.steps[RT.i].s - RT.left < 3) RT.i--; RT.left = RT.steps[RT.i].s; RT.end = Date.now() + RT.left * 1000; recShow(); }
function recDone() { const n = RT.n; recStop(); if ($('#rtbox')) $('#rtbox').innerHTML = `<div class="text-center py-6"><p class="text-4xl">✓</p><h3 class="text-xl font-black mt-2 text-emerald-300">¡Hecho!</h3><p class="text-sm text-zinc-300 mt-1">${esc(n)} completado. Esto también es entrenar.</p></div><button class="btn w-full" onclick="closeSheet()">Cerrar</button>`; }
function recStop() { if (RT) { clearInterval(RT.iv); try { RT.wl && RT.wl.release(); } catch (e) {} } RT = null; }
function recDetail(id) { const T = REC[id]; if (!T) return; recStop(); openSheet(`<div class="flex items-start justify-between gap-2"><h3 class="font-black text-lg">${esc(T.n)}</h3>${pill(LV[T.lvl][0], LV[T.lvl][1])}</div><p class="text-sm mt-2"><b>Cuándo:</b> ${esc(T.when)}</p><p class="text-sm"><b>Dosis:</b> ${esc(T.dose)}</p><div class="mt-2">${T.body()}</div>${T.variants ? `<div class="flex gap-2 flex-wrap mt-4">${Object.keys(T.variants).map(v => `<button class="btn2 text-sm" onclick="recPlay('${id}','${v}')">▶ ${esc(T.variants[v].n)} · ${esc(T.variants[v].dur)}</button>`).join('')}</div>` : ''}<button class="btn2 w-full mt-3" onclick="closeSheet()">Cerrar</button>`); }
/* ----- qué toca hoy (según calendario, carga y bienestar) ----- */
const RI = {foamPre: ['foam', 'pre', 'Foam roller · antes (≈6 min)'], foamPost: ['foam', 'post', 'Foam roller · después (≈12 min)'], suspiro: ['resp', 'suspiro', 'Respiración · suspiro cíclico (5 min)'], lenta: ['resp', 'lenta', 'Respiración lenta (5 min)'], auto: ['auto', 'completo', 'Automasaje (≈10 min)'], nutri: ['nutri', null, 'Batido de leche con cacao + comida con hidratos y proteína'], hidra: ['nutri', null, 'Hidratación: llega con la orina clara'], sueno: ['sueno', null, 'Rutina de bajada y sueño (7–9 h)'], crio: ['crio', 'inmersion', 'Inmersión en agua fría (opcional)']};
async function recToday() {

 if (ca && ca.rec_auto === false) return ''; const pr = asgFor(A, t).map[wd(t)]; if (pr && pr.routine && pr.routine.mode == 'recuperacion') return `<button class="card w-full text-left border-teal-400/40" onclick="S.date=today();go('train')"><b class="block">Tu entrenador te ha pautado la recuperación de hoy</b><span class="text-xs text-zinc-400">${esc(pr.routine.name)} · toca para verla</span></button>`;
 const md = new Set([...Object.keys(ev).filter(d => ev[d].some(e => e.kind == 'partido')), ...xs.map(x => x.log_date)]), M = k => md.has(add(t, k)), tr = (ev[t] || []).some(e => e.kind == 'entreno') || (pr && pr.routine);
 let title, why, it = [], when = {};
 if (M(0)) { title = 'Día de partido'; why = 'Hoy juegas: prepárate bien y empieza a recuperar nada más acabar.'; it = ['foamPre', 'suspiro', 'nutri', 'auto', 'sueno']; when = {foamPre: 'En la activación previa', suspiro: 'Al terminar el partido', nutri: '30–60 min después del partido', auto: 'Esta noche', sueno: 'Esta noche'}; if ([1, 2, 3].some(M)) { it.push('crio'); when.crio = 'Solo si tienes otro partido en menos de 72 h; en la primera hora tras el partido'; } }
 else if (M(-1)) { title = 'Día siguiente al partido'; why = 'Hoy es el día de mayor recuperación.'; it = ['foamPost', 'auto', 'lenta', 'nutri', 'sueno']; when = {foamPost: 'Hoy', auto: 'Hoy o esta noche', lenta: 'Al acabar', nutri: 'Comidas de hoy', sueno: 'Siesta de 20–30 min opcional (antes de las 16:00)'}; }
 else if (M(-2)) { title = 'Día libre tras el partido'; why = 'No hace falta nada extra: descansa y duerme bien.'; it = ['sueno']; }
 else if (M(1)) { title = 'Víspera de partido'; why = 'Mañana juegas: llega descansado.'; it = ['lenta', 'sueno']; when = {lenta: 'Antes de dormir (suspiro cíclico si hay nervios)', sueno: 'Pantallas fuera 60 min antes y horario fijo'}; }
 else if (M(2)) { title = 'Dos días antes del partido'; why = 'Carga media: activa y vuelve a la calma.'; it = ['foamPre', 'lenta']; when = {foamPre: 'Antes de entrenar', lenta: 'Al terminar la sesión'}; }
 else if (M(3) || M(4)) { title = 'Semana de carga'; why = 'Días de más carga: cuida la activación y la vuelta a la calma.'; it = ['foamPre', 'lenta']; when = {foamPre: 'Antes de entrenar', lenta: 'Al terminar la sesión'}; if (!tr) it = ['hidra', 'sueno']; }
 else if (tr) { title = 'Día de entreno'; why = 'Activa antes y vuelve a la calma al final.'; it = ['foamPre', 'lenta']; when = {foamPre: 'Antes de entrenar', lenta: 'Al terminar la sesión'}; }
 else { title = 'Día tranquilo'; why = 'Lo básico de hoy: hidratación y buen sueño.'; it = ['hidra', 'sueno']; }
 const w = wel.find(x => x.log_date == t), a = acwrAt(LD[ME.id], t), lowW = w && wScore(w) < 15, hiA = a && a.r > 1.3;
 if (lowW || hiA) { why += ' ' + (lowW ? 'Tu bienestar de hoy está bajo. ' : '') + (hiA ? 'Tu carga reciente es alta. ' : '') + 'Añade una sesión de recuperación completa y prioriza el sueño.'; ['foamPost', 'auto', 'lenta', 'sueno'].forEach(k => { if (!it.includes(k)) { it.push(k); when[k] = when[k] || 'Hoy, por tu estado'; } }); }
 return `<div class="card" style="border-color:#2dd4bf66"><div class="flex items-center justify-between gap-2"><b>Recuperación de hoy</b>${pill(title, '#2dd4bf')}</div><p class="text-xs text-zinc-400 mt-1">${esc(why)}</p><div class="mt-2 space-y-2">${it.map(k => { const [id, v, tx] = RI[k]; return `<div class="flex items-center gap-2"><div class="flex-1 min-w-0"><p class="text-sm font-bold">${esc(tx)}</p>${when[k] ? `<p class="text-[11px] text-zinc-400">${esc(when[k])}</p>` : ''}</div><button class="btn2 text-sm shrink-0" onclick="${v ? `recPlay('${id}','${v}')` : `recDetail('${id}')`}">${v ? '▶ Guía' : 'Ver'}</button></div>`; }).join('')}</div><button class="btn2 w-full mt-3 text-sm" onclick="recOpen('home')">Ver todas las técnicas</button></div>`; }

async function csvExport(aid) {
 try {
  const [pf, ss, ex, wl, ev, sl, bmx, stx, ckx] = await Promise.all([q(DB.from('profiles').select('full_name,email').eq('id', aid).single()), q(DB.from('session_logs').select('log_date,routine_name,rpe,minutes,notes').eq('athlete_id', aid).order('log_date')), q(DB.from('extra_sessions').select('log_date,kind,session_type,rpe,minutes,notes').eq('athlete_id', aid).order('log_date')), q(DB.from('wellness_logs').select('log_date,sleep_hours,sleep_quality,fatigue,soreness,stress,mood,pain_zone,notes').eq('athlete_id', aid).order('log_date')), q(DB.from('evaluations').select('eval_date,test,exercise,value,load_kg,reps,notes').eq('athlete_id', aid).order('eval_date')), q(DB.from('set_logs').select('log_date,exercise_name,set_no,kg,reps,secs,meters,done').eq('athlete_id', aid).order('log_date').limit(10000)), q(DB.from('body_measures').select('day,weight_kg,waist_cm,hip_cm,chest_cm,arm_cm,thigh_cm,notes').eq('athlete_id', aid).order('day')), q(DB.from('steps_logs').select('day,steps').eq('athlete_id', aid).order('day')), q(DB.from('weekly_checkins').select('week_start,energy,sleep,stress,motivation,notes').eq('athlete_id', aid).order('week_start'))]);
  const cell = v => { v = v == null ? '' : String(v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }, blk = (t, rows) => rows.length ? [t, Object.keys(rows[0]).join(';'), ...rows.map(r => Object.values(r).map(cell).join(';')), ''].join('\n') : t + '\n(sin datos)\n';
  const txt = '﻿' + [blk('SESIONES DE FUERZA', ss), blk('OTRAS SESIONES', ex), blk('SERIES REGISTRADAS', sl), blk('BIENESTAR', wl), blk('EVALUACIONES', ev), blk('MEDIDAS', bmx), blk('PASOS', stx), blk('CHECK-IN SEMANAL', ckx)].join('\n'), a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = 'datos_' + slug(pf.full_name || pf.email) + '_' + today() + '.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('Datos exportados');
 } catch (e) { console.error(e); }
}
